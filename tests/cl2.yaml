  - { kind: energy_combination, weight: 1.0, terms: { Cl2_204_min: +1, Cl2_Opt_min: -1 }, target: 0.0329787 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_194_min: +1, Cl2_Opt_min: -1 }, target: 3.07073 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_184_min: +1, Cl2_Opt_min: -1 }, target: 12.7814 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_174_min: +1, Cl2_Opt_min: -1 }, target: 32.3658 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_164_min: +1, Cl2_Opt_min: -1 }, target: 67.486 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_154_min: +1, Cl2_Opt_min: -1 }, target: 126.756 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_144_min: +1, Cl2_Opt_min: -1 }, target: 223.642 }

optimizer:
  method: sa
  T: 0.2
  T_min: 0.1
  alpha: 0.5             # called Temperature_decreasing_factor in the legacy SA
  max_iter: 2
  number_of_points: 1
  parallel: false
  seed: 0
  min_style: cg
  record_costs: true

output:
  dir: tests/runs/cl2_smoke
  record_costs: true
