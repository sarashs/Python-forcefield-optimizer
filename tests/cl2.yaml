# ---------------------------------------------------------------------------
# Simulations: one constrained `minimize` per structure. The `restraints:`
# list ports the pre-Phase-1 `#restrain` block (LAMMPS `fix restrain`
# arguments) so the bond stays at the QM-equilibrium length we want to
# evaluate the energy at.
# ---------------------------------------------------------------------------
simulations:
  Cl2_Opt_min: { structure: Cl2_Opt, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 2.056"] }
  Cl2_144_min: { structure: Cl2_144, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 1.44"] }
  Cl2_154_min: { structure: Cl2_154, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 1.54"] }
  Cl2_164_min: { structure: Cl2_164, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 1.64"] }
  Cl2_174_min: { structure: Cl2_174, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 1.74"] }
  Cl2_184_min: { structure: Cl2_184, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 1.84"] }
  Cl2_194_min: { structure: Cl2_194, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 1.94"] }
  Cl2_204_min: { structure: Cl2_204, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 2.04"] }
