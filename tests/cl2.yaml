# tests/cl2.yaml — sample PyField YAML config (Phase 1 schema).
#
# Equivalent to the legacy `Trainingfile_2.txt` + `Inputstructurefile.txt` +
# `params` triplet that drives `smoke_run.py`. Walks 20 Cl-Cl bond lengths
# against ΔE-from-equilibrium QM targets.
#
# Run with:  pyfield run tests/cl2.yaml
# (Phase 1 wires this; today the smoke still goes through smoke_run.py.)

forcefield:
  path: tests/ffieldoriginal.txt
  type: reaxff
  params: tests/params      # untouched ReaxFF/LAMMPS-style indices file

# ---------------------------------------------------------------------------
# Structures: each describes a simulation cell and the atoms in it.
# Inline `atoms:` keeps the demo self-contained; production configs would
# usually point at xyz files via `path:`.
# ---------------------------------------------------------------------------
structures:
  Cl2_Opt:
    box: [100, 100, 100]
    atoms:
      - { element: Cl, x: 0, y: 0, z: -1.02802, charge: 0 }
      - { element: Cl, x: 0, y: 0, z:  1.02802, charge: 0 }
  Cl2_144:
    box: [100, 100, 100]
