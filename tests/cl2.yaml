  Cl2_264_min: { structure: Cl2_264, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 2.64"] }
  Cl2_274_min: { structure: Cl2_274, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 2.74"] }
  Cl2_284_min: { structure: Cl2_284, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 2.84"] }
  Cl2_294_min: { structure: Cl2_294, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 2.94"] }
  Cl2_304_min: { structure: Cl2_304, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 3.04"] }
  Cl2_314_min: { structure: Cl2_314, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 3.14"] }
  Cl2_414_min: { structure: Cl2_414, type: minimize, min_style: cg, restraints: ["bond 1 2 2000 2000 4.14"] }

# ---------------------------------------------------------------------------
# Targets: each one is one residual added into the cost function. Here we
# use only `energy_combination` (the legacy ENERGY block, generalized) to
# match Cl-Cl ΔE from the equilibrium structure.  Numbers from
# tests/Trainingfile_2.txt.
# ---------------------------------------------------------------------------
targets:
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_414_min: +1, Cl2_Opt_min: -1 }, target: 81.394 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_314_min: +1, Cl2_Opt_min: -1 }, target: 56.0108 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_304_min: +1, Cl2_Opt_min: -1 }, target: 51.4507 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_294_min: +1, Cl2_Opt_min: -1 }, target: 46.72 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_284_min: +1, Cl2_Opt_min: -1 }, target: 41.4219 }
  - { kind: energy_combination, weight: 1.0, terms: { Cl2_274_min: +1, Cl2_Opt_min: -1 }, target: 35.6477 }
