[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfield"
version = "0.1.0"
description = "Force-field optimization driven by quantum-chemistry reference data."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "PyField contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "pyyaml",
    "pydantic>=2",
    "jinja2",
    "tqdm",                  # progress bars for SA / GA / CMA loops
]

[project.optional-dependencies]
mpi = ["lammps[mpi]"]
nn  = ["tensorflow"]
cma = ["cma"]                 # CMA-ES optimizer (`method: cma`)
qm  = [                       # planned `pyfield qm-prep` backends (DEV.md §11)
    "ase",                    # ASE Atoms + Calculator interface
    "pyscf",                  # pure-Python Gaussian-basis DFT, pip-only
]
dev = [
    "pytest",
    "nbmake",                 # executes example notebooks as regression tests
    "matplotlib",             # used by examples/cl2_walkthrough.ipynb
    "pyscf",                  # the qm-prep preview cell
    "cma",                    # so test_cma.py runs in dev installs
]

[project.scripts]
pyfield = "pyfield.cli:main"

[tool.setuptools.packages.find]
include = ["pyfield*"]

[tool.setuptools.package-data]
pyfield = ["simulations/templates/*.j2"]
