[pytest]
testpaths = tests examples
markers =
    lammps: tests that require LAMMPS to be installed and importable
    notebook: notebook regression tests (executed by nbmake)
# `water_walkthrough.ipynb` is a heavy demo (16 constrained DFT relaxes
# + parallel SA over 23 LAMMPS sims). Excluded from the default run so
# `pytest` stays under a minute. Run it manually:
#   pytest examples/water_walkthrough.ipynb --nbmake --nbmake-timeout=1200
addopts = -ra --nbmake --nbmake-kernel=python3 --nbmake-timeout=900 --ignore=examples/water_walkthrough.ipynb
