[pytest]
testpaths = tests examples
markers =
    lammps: tests that require LAMMPS to be installed and importable
    notebook: notebook regression tests (executed by nbmake)
# `water_walkthrough.ipynb` and the `studies/` notebooks are heavy
# demos (constrained DFT relaxes + parallel optimisation over many
# LAMMPS sims). Excluded from the default run so `pytest` stays under
# a minute. Run them manually, e.g.:
#   pytest examples/water_walkthrough.ipynb --nbmake --nbmake-timeout=1200
#   pytest studies/gst_drift/gst_drift_walkthrough.ipynb --nbmake --nbmake-timeout=86400
addopts = -ra --nbmake --nbmake-kernel=python3 --nbmake-timeout=900 --ignore=examples/water_walkthrough.ipynb --ignore=studies/
